# Cuts a release: tags the head of the branch it runs on with the next version and starts the
# release workflow on that tag (release.yml), which builds and publishes it. The next version is the
# latest release tag's (pre-releases like v1.2.0-beta.1 do not count) with the chosen part bumped,
# counting from v0.0.0 when there is none.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

# One bump at a time, so two runs cannot pick the same version.
concurrency:
  group: bump
  cancel-in-progress: false

permissions:
  contents: write # push the tag
  actions: write # start the release on it

jobs:
  bump:
    name: Bump (${{ inputs.version_bump }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every tag, for the latest release

      - name: Next version
        id: next
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          IFS=. read -r major minor patch <<<"${latest#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case "$BUMP" in
            major) version=$((major + 1)).0.0 ;;
            minor) version=$major.$((minor + 1)).0 ;;
            patch) version=$major.$minor.$((patch + 1)) ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "latest release: ${latest:-none}; next ($BUMP): v$version"

      # A tag pushed with the workflow's token starts no workflow, so the release is started on it
      # explicitly (workflow_dispatch with the tag as ref).
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.next.outputs.version }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh workflow run release.yml --ref "$TAG"
          {
            echo "Tagged \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`) as \`$TAG\` and started the release on it;"
            echo "it publishes the GitHub release when the Mac, Windows and Linux builds pass."
          } >>"$GITHUB_STEP_SUMMARY"
